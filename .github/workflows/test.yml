name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi "pydantic>=2" httpx pyyaml pytest pytest-asyncio openai
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration
